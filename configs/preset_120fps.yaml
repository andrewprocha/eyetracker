# DualEyeTracker 120 FPS Preset
# Optimized for high-speed tracking with good IR lighting

cameras:
  left_id: 0
  right_id: 1
  width: 320
  height: 240
  fps: 120
  exposure_us: 4000  # Short exposure for high speed
  backend: "dshow"
  pixel_format: "YUY2"

sync:
  tolerance_ms: 4.0  # Tighter tolerance for high FPS

processing:
  eyelid_exclusion_pct: 20.0
  lash_kernel_length: 15
  lash_kernel_thickness: 2
  min_area: 50
  max_area: 5000
  min_circularity: 0.35  # Slightly stricter
  max_eccentricity: 0.90
  min_ring_contrast: 18.0  # Higher quality threshold
  morph_open_size: 3
  morph_close_size: 5
  border_margin: 5

ui:
  enable_display: true
  save_telemetry: false
  save_video: false
