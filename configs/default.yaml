# DualEyeTracker Default Configuration

cameras:
  left_id: 0
  right_id: 1
  width: 320
  height: 240
  fps: 120
  exposure_us: 4000  # 4ms exposure for 120fps (adjust based on lighting)
  backend: "dshow"  # "dshow" or "msmf"
  pixel_format: "YUY2"  # "YUY2" or "MJPG"

sync:
  tolerance_ms: 5.0  # Maximum time difference for frame pairing

processing:
  eyelid_exclusion_pct: 20.0  # Percentage of top/bottom to mask
  lash_kernel_length: 15
  lash_kernel_thickness: 2
  min_area: 50
  max_area: 5000
  min_circularity: 0.3
  max_eccentricity: 0.95
  min_ring_contrast: 15.0
  morph_open_size: 3
  morph_close_size: 5
  border_margin: 5

ui:
  enable_display: true
  save_telemetry: false
  save_video: false
