name: CI

on:
  push:
    branches: [ main, claude/* ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run ruff
        run: |
          ruff check dual_eye_tracker/ tests/ scripts/

      - name: Run black check
        run: |
          black --check dual_eye_tracker/ tests/ scripts/

      - name: Run mypy
        run: |
          mypy dual_eye_tracker/ --ignore-missing-imports
        continue-on-error: true

      - name: Run tests
        run: |
          pytest -v --tb=short

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            .pytest_cache/
            *.log
          retention-days: 7
